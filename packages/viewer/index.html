<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>describe-me</title>
    <script>
      // Before the stylesheet and the body, so the first paint has the stored theme. src/theme-switch.ts writes the key.
      try {
        const theme = localStorage.getItem('describe-me:theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch {
        // Without storage the viewer follows the system.
      }
    </script>
    <link rel="icon" href="/src/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
