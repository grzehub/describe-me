# Every pull request and push to main: build, lint, format, the example suite,
# and the tarball smoke test that installs the packed packages into a fresh
# project the way a user would, against the default toolchain and two older
# Vite/Vitest combinations.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter describe-me typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter react-browser exec playwright install --with-deps chromium
      - run: pnpm --filter react-browser test
      - run: pnpm --filter react-jsdom test
      - run: pnpm --filter react-jsdom check-styles
      - run: pnpm check-manifest
      - run: pnpm check-style-store
      - run: pnpm check-font-audit

  smoke:
    name: smoke (${{ matrix.name }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The toolchain the examples run on.
          - name: default
            args: ''
          # An older Vite 8 minor.
          - name: vite-8.2
            args: --vite 8.2.2
          # The oldest supported Vitest with the oldest supported Vite.
          - name: vitest-4
            args: --vitest 4.1.11 --vite 6.4.3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter react-browser exec playwright install --with-deps chromium
      - run: pnpm smoke ${{ matrix.args }}
