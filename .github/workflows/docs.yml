# Runs both example suites and publishes the docs pages at the root of GitHub
# Pages, with each example viewer under examples/<name>/.
# Enable Pages with source "GitHub Actions" in the repository settings once.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter react-browser exec playwright install --with-deps chromium
      - run: pnpm --filter react-browser test
      - run: pnpm --filter react-jsdom test
      - run: pnpm check-manifest
      - run: pnpm check-docs
      # Unlike ci.yml, vendor the web fonts, so the published viewers carry them.
      - run: pnpm site:build
      - run: pnpm check-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
