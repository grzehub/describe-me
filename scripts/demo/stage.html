<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>describe-me demo stage</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #13161d;
        --band: #0a0a0a;
        --line: #232835;
        --text: #e6e9ef;
        --dim: #8b93a5;
        --accent: #8b7cf6;
        --ok: #4ade80;
        --keyword: #c792ea;
        --string: #a5d6a7;
        --name: #82aaff;
        --comment: #6b7280;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --sans: Inter, -apple-system, 'Segoe UI', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        overflow: hidden;
      }
      .stage {
        display: grid;
        grid-template-rows: 680px 400px;
        width: 1920px;
        height: 1080px;
      }
      .band {
        display: grid;
        grid-template-columns: 1180px 1fr;
        min-height: 0;
        border-top: 1px solid var(--line);
        background: var(--band);
      }
      .codepane {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }
      .file {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 32px 6px;
        font: 500 15px var(--mono);
        color: var(--dim);
      }
      .file b {
        color: var(--text);
        font-weight: 600;
      }
      .code {
        margin: 0;
        padding: 4px 0 16px;
        font: 18px/1.5 var(--mono);
        overflow: hidden;
        min-height: 0;
        white-space: pre;
        scroll-behavior: smooth;
      }
      .line {
        display: block;
        padding: 0 32px 0 29px;
        border-left: 3px solid transparent;
        opacity: 0.3;
        transition:
          opacity 0.4s,
          background 0.4s;
      }
      .code.plain .line,
      .line.hot {
        opacity: 1;
      }
      .line.hot {
        background: rgba(139, 124, 246, 0.13);
        border-left-color: var(--accent);
      }
      /* The eye goes where the light is: the viewer dims under the test, the test under the viewer. */
      .stage[data-focus='viewer'] .code.plain .line {
        opacity: 0.3;
      }
      .stage[data-focus='code'] .right {
        opacity: 0.35;
      }
      .keyword {
        color: var(--keyword);
      }
      .string {
        color: var(--string);
      }
      .name {
        color: var(--name);
      }
      .comment {
        color: var(--comment);
        font-style: italic;
      }
      .side {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 0;
        padding: 26px 36px 24px 32px;
        border-left: 1px solid var(--line);
      }
      .term {
        padding: 12px 18px;
        min-height: 78px;
        border-radius: 10px;
        background: #0a0c10;
        border: 1px solid var(--line);
        font: 15px/1.55 var(--mono);
        color: var(--dim);
        white-space: pre;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .term.shown {
        opacity: 1;
      }
      .term .prompt {
        color: var(--text);
      }
      .term .ok {
        color: var(--ok);
      }
      .term .url {
        color: var(--name);
      }
      .caption {
        font-size: 30px;
        line-height: 1.3;
        font-weight: 500;
        letter-spacing: -0.01em;
        transition: opacity 0.3s;
      }
      .caption.out {
        opacity: 0;
      }
      .caption em {
        font-style: normal;
        color: var(--accent);
      }
      .right {
        position: relative;
        background: #111316;
        transition: opacity 0.45s;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #cursor {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 20;
        pointer-events: none;
        opacity: 0;
        transition:
          transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.3s;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      }
      #cursor.shown {
        opacity: 1;
      }
      #cursor svg {
        display: block;
        transition: transform 0.12s;
        transform-origin: 4px 3px;
      }
      #cursor.down svg {
        transform: scale(0.82);
      }
      #ring {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 19;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        border: 3px solid var(--accent);
        pointer-events: none;
        opacity: 0;
        transform: scale(0.4);
      }
      #ring.pulse {
        animation: pulse 0.55s ease-out;
      }
      @keyframes pulse {
        0% {
          opacity: 0.9;
          transform: scale(0.4);
        }
        100% {
          opacity: 0;
          transform: scale(1.3);
        }
      }
      #end {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: var(--bg);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s;
      }
      #end.shown {
        opacity: 1;
      }
      #end img {
        display: block;
        width: 1920px;
        height: 1080px;
      }
      #end .sygnet-slot {
        position: absolute;
        left: 878px;
        top: 248px;
        width: 164px;
        height: 164px;
        background: var(--bg);
      }
      #end .sygnet {
        position: absolute;
        left: 2px;
        top: 2px;
        overflow: visible;
      }
      .paren,
      .plate,
      .shadow {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }
      #end.shown .paren-left {
        animation: paren-left 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
      }
      #end.shown .paren-right {
        animation: paren-right 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
      }
      #end.shown .plate {
        animation: plate 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      #end.shown .plate-1 {
        animation-delay: 0.85s;
      }
      #end.shown .plate-2 {
        animation-delay: 1.05s;
      }
      #end.shown .plate-3 {
        animation-delay: 1.25s;
      }
      #end.shown .shadow {
        animation: fade 0.5s ease-out 1.3s forwards;
      }
      @keyframes paren-left {
        from {
          opacity: 0;
          transform: translateX(-16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes paren-right {
        from {
          opacity: 0;
          transform: translateX(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes plate {
        from {
          opacity: 0;
          transform: translate(14px, -8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes fade {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>

        <div class="side">

    <script>
      const byId = (id) => document.getElementById(id)
      const escapeHtml = (text) =>
        text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

      const TOKENS = {
        tsx: [
          ['comment', /\/\/.*$/],
          ['string', /'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`/],
          [
            'keyword',
            /\b(?:import|from|export|const|let|function|async|await|return|if|else|interface|type)\b/,
          ],
          ['name', /\b(?:describe|it|expect|step|render|userEvent|screen|vi)\b(?=[.(])/],
        ],
        css: [
          ['comment', /\/\*[\s\S]*?\*\//],
          ['keyword', /@[a-z-]+|:root|\.dark/],
          ['name', /--[a-z0-9-]+(?=\s*:)/],
          ['string', /oklch\([^)]*\)|'[^']*'/],
        ],
      }

      function highlight(line, language) {
        const rules = TOKENS[language] ?? []
        let out = ''
        let rest = line

        while (rest.length > 0) {
          let best = null

          for (const [kind, pattern] of rules) {
            const match = pattern.exec(rest)

            if (match && (best === null || match.index < best.index)) {
              best = { kind, index: match.index, text: match[0] }
            }
          }

          if (best === null) {
            out += escapeHtml(rest)
            break
          }

          out += escapeHtml(rest.slice(0, best.index))
          out += `<span class="${best.kind}">${escapeHtml(best.text)}</span>`
          rest = rest.slice(best.index + best.text.length)
        }

        return out
      }

      window.stage = {
        setCode({ file, language, text }) {
          byId('file').textContent = file
          byId('language').textContent = language
          byId('code').className = 'code plain'
          byId('code').innerHTML = text
            .split('\n')
            .map(
              (line, i) =>
                `<span class="line" data-line="${i + 1}">${highlight(line, language)}</span>`,
            )
            .join('')
        },

        hot(lines) {
          const code = byId('code')
          code.classList.toggle('plain', lines.length === 0)

          for (const element of code.querySelectorAll('.line')) {
            element.classList.toggle('hot', lines.includes(Number(element.dataset.line)))
          }

          const first = code.querySelector('.line.hot')
          const last = [...code.querySelectorAll('.line.hot')].pop()

          if (first && last) {
            const top = first.offsetTop - code.offsetTop
            const bottom = last.offsetTop - code.offsetTop + last.offsetHeight
            code.scrollTop = Math.max(0, (top + bottom) / 2 - code.clientHeight / 2)
          }
        },

        term(lines) {
          byId('term').classList.add('shown')
          byId('term').innerHTML = lines
            .map(({ kind, text }) => `<span class="${kind}">${escapeHtml(text)}</span>`)
            .join('\n')
        },

        caption(html) {
          const caption = byId('caption')
          caption.classList.add('out')
          setTimeout(() => {
            caption.innerHTML = html
            caption.classList.remove('out')
          }, 300)
        },

        cursor(x, y) {
          const cursor = byId('cursor')
          cursor.style.transform = `translate(${x - 4}px, ${y - 3}px)`
          cursor.classList.add('shown')
        },

        press(x, y, down) {
          byId('cursor').classList.toggle('down', down)

          if (down) {
            const ring = byId('ring')
            ring.style.left = `${x}px`
            ring.style.top = `${y}px`
            ring.classList.remove('pulse')
            void ring.offsetWidth
            ring.classList.add('pulse')
          }
        },

        focus(target) {
          byId('stage').dataset.focus = target
        },

        end() {
          byId('end').classList.add('shown')
        },
      }
    </script>
